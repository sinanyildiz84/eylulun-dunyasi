<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B2050">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="ikon-192.png">
<title>Eylül'ün Dünyası</title>
<style>
:root{--ink:#2B2050;--muted:#7A6F8C;--sun:#FFC53D;--paper:#fff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,#FFE3F1,#E9DCFF 55%,#CFEFFF);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:16px}
main{margin:auto 0;width:min(440px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:28px;padding:24px 20px;box-shadow:0 10px 0 rgba(43,32,80,.2);display:flex;flex-direction:column;gap:14px;text-align:center}
.simge{font-size:64px;line-height:1}
h1{margin:0;font-size:26px}
p{margin:0;font-weight:600;line-height:1.4}
.not{font-size:14px;color:var(--muted)}
input{width:100%;min-height:56px;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;color:var(--ink);background:#FFFDF6;text-align:center}
input:focus{outline:4px solid #4FB0F0;outline-offset:2px}
button{min-height:60px;font:inherit;font-size:22px;font-weight:800;border:3px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 rgba(43,32,80,.2);cursor:pointer;padding:0 20px}
button:active{transform:translateY(4px);box-shadow:none}
button:disabled{opacity:.6}
button.ikincil{background:#fff;font-size:17px;min-height:48px}
.sifre-satir{display:flex;gap:8px}.sifre-satir input{flex:1;min-width:0}
button.goz{flex:none;width:60px;min-height:56px;padding:0;background:#fff;box-shadow:none;font-size:24px}button.goz[aria-pressed="true"]{background:#F3EFFC}
.cubuk{height:18px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#F3EFFC}
.cubuk i{display:block;height:100%;width:0;background:var(--sun);transition:width .2s}
.hata{background:#FDE8E7;border:3px solid #D6453D;border-radius:14px;padding:10px;font-weight:800}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="kutu" hidden>
  <div class="simge" id="simge">🔐</div>
  <h1 id="baslik">Aile şifresi</h1>
  <p id="aciklama">Bu uygulama şifreyle açılır. Şifre bu cihazda bir kez sorulur.</p>
  <form id="form" autocomplete="off">
    <div class="sifre-satir"><input id="sifre" type="password" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Aile şifresi" placeholder="Şifreyi yazın"><button type="button" class="goz" id="goz" aria-label="Şifreyi göster" aria-pressed="false">👁️</button></div>
    <div style="height:12px"></div>
    <button id="ac" type="submit" style="width:100%">Aç</button>
  </form>
  <div class="cubuk" id="cubuk" hidden><i id="dolu"></i></div>
  <p class="not" id="durum" hidden></p>
  <div class="hata" id="hata" hidden></div>
  <button class="ikincil" id="yeniden" hidden>Yeniden dene</button>
  <button class="ikincil" id="eski" hidden>Eski sürümle devam et</button>
  <p class="not" style="font-size:11px;opacity:.6" id="kabuk">20261005-151835</p>
</main>
<script>
(async()=>{
'use strict';
const $=id=>document.getElementById(id);
const goster=(id,ac)=>{ $(id).hidden=!ac; };
/* ---------- device storage: the decrypted app and the two non-extractable keys ---------- */
const VT='eylul-dunyasi-kurulum', DEPO='depo';
const vtAc=()=>new Promise((res,rej)=>{ const r=indexedDB.open(VT,1); r.onupgradeneeded=()=>r.result.createObjectStore(DEPO); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const islem=async(mod,fn)=>{ const d=await vtAc(); return new Promise((res,rej)=>{ const t=d.transaction(DEPO,mod), q=fn(t.objectStore(DEPO)); t.oncomplete=()=>{ d.close(); res(q&&q.result); }; t.onerror=t.onabort=()=>{ d.close(); rej(t.error); }; }); };
const al=k=>islem('readonly',s=>s.get(k)).catch(()=>undefined);
const koy=(k,v)=>islem('readwrite',s=>s.put(v,k));
const sil=k=>islem('readwrite',s=>s.delete(k)).catch(()=>{});

/* ---------- run the app in this page, at this address ---------- */
function calistir(html){
  const ek='<scr'+'ipt>window.EYLUL_WEB=true</scr'+'ipt><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2B2050"><link rel="apple-touch-icon" href="ikon-192.png">';
  html=html.replace('<head>','<head>'+ek);
  document.open(); document.write(html); document.close();
}

/* ---------- download with progress ---------- */
async function indir(){
  goster('cubuk',true); goster('durum',true); $('durum').textContent='İndiriliyor…';
  const r=await fetch('uygulama.bin?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('ag');
  const toplam=+r.headers.get('content-length')||0, okur=r.body.getReader(), parcalar=[]; let n=0;
  for(;;){ const {done,value}=await okur.read(); if(done) break; parcalar.push(value); n+=value.length;
    $('dolu').style.width=(toplam?Math.min(100,n/toplam*100):50)+'%';
    $('durum').textContent='İndiriliyor… '+(n/1048576).toFixed(1)+(toplam?' / '+(toplam/1048576).toFixed(1):'')+' MB'; }
  const b=new Uint8Array(n); let o=0; for(const p of parcalar){ b.set(p,o); o+=p.length; }
  return b;
}

/* ---------- file: "EYL1" | salt 16 | rounds 4 | iv 16 | AES-256-CBC(gzip(app)) | HMAC-SHA256 over everything before it ---------- */
async function anahtarTuret(sifre,b){
  const tuz=b.subarray(4,20), tur=new DataView(b.buffer,b.byteOffset+20,4).getUint32(0);
  const ham=await crypto.subtle.importKey('raw',new TextEncoder().encode(sifre.trim().normalize('NFC')),'PBKDF2',false,['deriveBits']);
  const bit=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:tuz,iterations:tur},ham,512));
  const aes=await crypto.subtle.importKey('raw',bit.subarray(0,32),{name:'AES-CBC'},false,['decrypt']);
  const mac=await crypto.subtle.importKey('raw',bit.subarray(32),{name:'HMAC',hash:'SHA-256'},false,['verify']);
  bit.fill(0);
  return {aes,mac};
}
async function coz(b,a){
  if(b.length<120||String.fromCharCode(b[0],b[1],b[2],b[3])!=='EYL1') throw new Error('bicim');
  const n=b.length-32;
  if(!(await crypto.subtle.verify('HMAC',a.mac,b.subarray(n),b.subarray(0,n)))) throw new Error('sifre');
  const duz=await crypto.subtle.decrypt({name:'AES-CBC',iv:b.subarray(24,40)},a.aes,b.subarray(40,n));
  return await new Response(new Blob([duz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

/* ---------- screens ---------- */
function ekran(simge,baslik,aciklama){ $('simge').textContent=simge; $('baslik').textContent=baslik; $('aciklama').textContent=aciklama;
  ['form','cubuk','durum','hata','yeniden','eski'].forEach(id=>goster(id,false)); goster('kutu',true); }
function hataYaz(m){ $('hata').textContent=m; goster('hata',true); }

let bayt=null;   // the downloaded file, kept so a mistyped password does not download it again
function kilitEkrani(not){
  ekran('🔐','Aile şifresi','Bu uygulama şifreyle açılır. Şifre bu cihazda bir kez sorulur.');
  goster('form',true); if(not) hataYaz(not);
  $('sifre').value=''; $('ac').disabled=false; gozAyarla(false); try{ $('sifre').focus(); }catch(e){}
}
// the password is hidden while typing; the eye shows it for a moment to catch a typing mistake
function gozAyarla(acik){ $('sifre').type=acik?'text':'password'; $('goz').setAttribute('aria-pressed',acik); $('goz').textContent=acik?'🙈':'👁️'; $('goz').setAttribute('aria-label',acik?'Şifreyi gizle':'Şifreyi göster'); }
$('goz').addEventListener('click',()=>{ gozAyarla($('sifre').type==='password'); try{ $('sifre').focus(); }catch(e){} });
$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const sifre=$('sifre').value; if(sifre.trim().length<4){ hataYaz('Şifreyi yazın.'); return; }
  $('ac').disabled=true; goster('hata',false);
  try{
    if(!bayt) bayt=await indir();
    $('durum').textContent='Şifre denetleniyor…'; goster('durum',true);
    const a=await anahtarTuret(sifre,bayt);
    const html=await coz(bayt,a);
    $('durum').textContent='Kuruluyor…';
    await koy('anahtar',a); await koy('uygulama',{html,zaman:Date.now()});
    try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(_){}
    calistir(html);
  }catch(err){
    $('ac').disabled=false; goster('cubuk',false); goster('durum',false);
    if(err&&err.message==='sifre') hataYaz('Şifre yanlış. Büyük ve küçük harflere dikkat edin.');
    else if(err&&err.message==='bicim'){ bayt=null; hataYaz('İndirilen dosya bozuk. Yeniden deneyin.'); }
    else if(err&&err.name==='QuotaExceededError') hataYaz('Bu cihazda yeterli yer yok.');
    else { bayt=null; hataYaz('İndirilemedi. İnternet bağlantısını kontrol edin.'); }
  }
});

async function guncelle(anahtar,eski){
  ekran('⬇️','Güncelleniyor','Yeni sürüm indiriliyor. Anahtar ve yapılan oyunlar silinmez.');
  try{
    bayt=await indir();
    $('durum').textContent='Kuruluyor…';
    const html=await coz(bayt,anahtar);
    await koy('uygulama',{html,zaman:Date.now()});
    calistir(html);
  }catch(err){
    if(err&&err.message==='sifre'){ await sil('anahtar'); kilitEkrani('Aile şifresi değişmiş. Yeni şifreyi girin.'); return; }
    ekran('⚠️','Güncellenemedi',err&&err.name==='QuotaExceededError'?'Bu cihazda yeterli yer yok.':'Yeni sürüm indirilemedi. İnternet bağlantısını kontrol edin.');
    bayt=null; goster('yeniden',true); $('yeniden').onclick=()=>guncelle(anahtar,eski);
    if(eski){ goster('eski',true); $('eski').onclick=()=>calistir(eski.html); }
  }
}

/* ---------- start ---------- */
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
if(!window.isSecureContext||!window.crypto||!crypto.subtle||!window.indexedDB||typeof DecompressionStream!=='function'){
  ekran('⚠️','Bu tarayıcı uygun değil','Uygulama güncel bir Chrome, Edge ya da Safari ile açılır.'); return;
}
const p=new URLSearchParams(location.search), istenen=p.has('guncelle');
if(p.has('kilitle')){ await sil('uygulama'); await sil('anahtar'); }
if(location.search){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
const kayit=await al('uygulama'), anahtar=await al('anahtar');
if(kayit&&kayit.html&&!istenen){ calistir(kayit.html); return; }
if(anahtar&&anahtar.aes&&anahtar.mac){ guncelle(anahtar,kayit&&kayit.html?kayit:null); return; }
kilitEkrani();
})();
</script>
</body>
</html>
